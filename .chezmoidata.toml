# Chezmoi Default Data
# This file provides safe defaults for all machines.
# Machine-specific overrides go in ~/.config/chezmoi/chezmoi.toml

# =============================================================================
# MODULES
# =============================================================================
# Enable/disable optional components per machine.
# Set to true to include, false to exclude.

[modules]
  workstation = false  # GUI tools + Homebrew packages (nvim, bat, btop, starship, Brewfile)
