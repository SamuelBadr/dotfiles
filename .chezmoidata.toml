# Chezmoi Default Data
# This file provides safe defaults for all machines.
# Machine-specific overrides go in ~/.config/chezmoi/chezmoi.toml

# =============================================================================
# MODULES
# =============================================================================
# Enable/disable optional components per machine.
# Set to true to include, false to exclude.

# Optional per-machine guards. Override these in ~/.config/chezmoi/chezmoi.toml
# with [data] / [data.git] entries when needed.
hpcLoginNode = false

[git]
  signing = false

[modules]
  workstation = false  # GUI tools + Homebrew packages (nvim, bat, bottom, starship, Brewfile)
